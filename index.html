<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?familly=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
/</head>
<body>
    <div class="container">
        <div class="toggle">
            <span id="loginToggle" class="active">Log In</span>
            <span id="singupToggle">Sing Up</span>
            <div class="slider"></div>
        </div>

        <div class="form-container">
            <!-- Login Form -->
            <form id="loginForm" class="form active">
                <h2>Log in</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Usarname">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password">
                </div>
                <button class="btn">LOGIN</button>
                <p class="or">Or</p>
                <div class="social-buttons">
                    <button class="fb">f</button>
                    <button class="gl">g</button>
                    <button class="tw">i</button>
                </div>
                <a href="#" class="forgot">Forgot your password?</a>
            </form>

            <!-- Sing up Form -->
            <form id="singupForm" class="form">
                <h2>Sing up</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Name">
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="text" placeholder="Phone">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password">
                </div>
                <button class="btn">REGISTER</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
